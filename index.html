<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ledger — a focused student study planner and grade dashboard.">
  <title>Ledger — Study planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">L</span><span>Ledger</span></div>
      <nav class="nav" aria-label="Primary navigation">
        <button class="nav-item active" data-view="dashboard"><svg aria-hidden="true"><use href="#icon-grid"></use></svg><span>Dashboard</span></button>
        <button class="nav-item" data-view="courses"><svg aria-hidden="true"><use href="#icon-book"></use></svg><span>Courses</span></button>
        <button class="nav-item" data-view="assignments"><svg aria-hidden="true"><use href="#icon-check"></use></svg><span>Assignments</span></button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span><span>All changes saved</span></div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">STUDENT PLANNER</p>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <button class="button secondary" id="quick-add-course"><svg aria-hidden="true"><use href="#icon-plus"></use></svg> Course</button>
          <button class="button primary" id="quick-add-assignment"><svg aria-hidden="true"><use href="#icon-plus"></use></svg> Assignment</button>
        </div>
      </header>

      <div id="app-view" class="view-container"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header"><div><p class="eyebrow" id="modal-kicker">NEW ITEM</p><h2 id="modal-title">Add course</h2></div><button class="icon-button" id="modal-close" aria-label="Close modal"><svg aria-hidden="true"><use href="#icon-close"></use></svg></button></div>
      <form id="modal-form"></form>
    </section>
  </div>

  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
    <symbol id="icon-book" viewBox="0 0 24 24"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5v-17Z"/><path d="M5 19.5A2.5 2.5 0 0 1 7.5 17H20M9 6h7"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/><path d="M5 4h14v16H5z"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M12 4 3 20h18L12 4Z"/><path d="M12 9v5M12 17h.01"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="m4 16-.8 4.8L8 20l11.5-11.5a2.1 2.1 0 0 0-3-3L5 17Z"/><path d="m14.5 7.5 2 2"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></symbol>
    <symbol id="icon-trend" viewBox="0 0 24 24"><path d="m4 16 5-5 4 3 7-8"/><path d="M15 6h5v5"/></symbol>
  </svg>
  <script src="app.js"></script>
</body>
</html>
